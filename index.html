<!DOCTYPE html>
<html lang="hi">
<head>
    <meta name="google-site-verification" content="XouE1kjqG619HkcdFbpVT-3x_Ih0oEd8SkVDrse6lpo" />
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="description" content="Global Harmony Pro - Premium Audio Studio">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f3f4f6">
    <title>Global Harmony Pro</title>

    <link rel="manifest" href="manifest.json?v=14">
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>

    <style>
        :root {
            --bg-color: #f3f4f6;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --accent-blue: #3b82f6;
            --shadow-light: #ffffff;
            --shadow-dark: #d1d5db;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* 3D NEUMORPHIC EFFECTS */
        .neumorphic {
            background: var(--bg-color);
            border-radius: 16px;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            transition: all 0.2s ease;
            border: none;
        }
        .neumorphic:active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
        }
        .neumorphic-inset {
            background: var(--bg-color);
            border-radius: 16px;
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            border: none;
        }

        /* BUTTONS */
        .btn {
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }

        /* GOLDEN TICKET PREMIUM BADGE */
        .golden-ticket {
            background: linear-gradient(135deg, #fde047 0%, #eab308 50%, #ca8a04 100%);
            color: #422006;
            font-weight: 800;
            border: 2px dashed #a16207;
            padding: 8px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(202, 138, 4, 0.4);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            transition: transform 0.15s ease;
        }
        .golden-ticket:hover { transform: scale(1.05) rotate(-1deg); }

        /* HEADER LAYOUT */
        .header { padding: 15px 30px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 0; z-index: 100; background: rgba(243, 244, 246, 0.9); backdrop-filter: blur(10px); }
        .top-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 15px; }
        
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; color: var(--text-main); }
        .brand svg { width: 32px; height: 32px; }

        .search-container { flex: 1; max-width: 400px; display: flex; align-items: center; gap: 10px; }
        .search-bar { width: 100%; padding: 12px 20px; font-size: 14px; color: var(--text-main); outline: none; }

        .right-actions { display: flex; align-items: center; gap: 15px; }
        .profile-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer; }
        .founder-badge { display: none; }
        body.founder-active .founder-badge { display: inline-flex !important; }

        .sub-row { display: flex; justify-content: space-between; align-items: center; width: 100%; padding-top: 10px; border-top: 1px solid #e5e7eb; }
        .sub-title { font-weight: 800; font-size: 16px; letter-spacing: 0.5px; }
        .sub-actions { display: flex; gap: 15px; }
        .sub-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 10px 15px; }

        /* MAIN TWO-PANEL LAYOUT */
        .main-content { display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; padding: 20px 30px 120px 30px; flex: 1; }
        .panel { padding: 25px; display: flex; flex-direction: column; gap: 20px; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 700; }
        
        .song-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 20px; }
        .song-card { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 15px; cursor: pointer; }
        .song-icon-box { width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; font-size: 24px; color: var(--accent-blue); border-radius: 12px; }
        .song-title { font-size: 12px; font-weight: 600; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* UNIFIED BOTTOM PLAYER BAR */
        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; border-radius: 24px 24px 0 0; }
        .nav-items { display: flex; gap: 15px; align-items: center; }
        .nav-icon { width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; border-radius: 12px; }
        
        .player-controls { flex: 1; display: flex; justify-content: center; align-items: center; gap: 20px; padding: 0 40px; }
        .audio-element { width: 100%; max-width: 500px; height: 35px; border-radius: 20px; }

        .now-playing { display: flex; align-items: center; gap: 12px; width: 250px; }
        .now-playing-info h4 { font-size: 13px; font-weight: 700; }
        .now-playing-info p { font-size: 11px; color: var(--text-muted); }

        /* MODALS */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); backdrop-filter: blur(5px); z-index: 3000; justify-content: center; align-items: center; }
        .modal-card { width: 90%; max-width: 450px; padding: 25px; display: flex; flex-direction: column; gap: 15px; text-align: center; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 18px; }

        /* ADMIN PANEL USER LIST */
        .admin-user-row { display: flex; align-items: center; gap: 15px; padding: 12px; text-align: left; }
        .admin-user-img { width: 40px; height: 40px; border-radius: 50%; }
        .admin-user-info h4 { font-size: 14px; margin-bottom: 2px; }
        .admin-user-info p { font-size: 11px; color: var(--text-muted); }

        @media (max-width: 900px) {
            .main-content { grid-template-columns: 1fr; }
            .top-row { flex-wrap: wrap; }
            .search-container { order: 3; max-width: 100%; }
            .bottom-bar { flex-direction: column; gap: 15px; padding: 15px; border-radius: 16px 16px 0 0; }
            .player-controls { width: 100%; padding: 0; }
        }
    </style>
</head>
<body>

    <!-- HEADER SECTION -->
    <header class="header">
        <div class="top-row">
            <div class="brand">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="45" stroke="#3b82f6" stroke-width="8"/>
                    <path d="M50 25 C30 25 25 40 25 50 C25 60 30 75 50 75 C70 75 75 60 75 50 H50" stroke="#1f2937" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Global Harmony
            </div>
            
            <div class="search-container">
                <input type="text" class="search-bar neumorphic-inset" id="searchInput" placeholder="Search Songs..." onkeyup="searchSongs()">
            </div>

            <div class="right-actions">
                <label for="multiFileInput" class="btn neumorphic">➕ Import Songs</label>
                <!-- ADMIN PANEL BUTTON (Only Founder sees this) -->
                <button class="btn neumorphic founder-badge" style="background:#1f2937; color:#fff;" onclick="openModal('adminDashboardModal'); fetchActiveUsers();">👑 ADMIN PANEL</button>
                <div class="golden-ticket" onclick="openModal('vipGateModal')">🎟️ +GET PREMIUM</div>
                <div class="profile-icon neumorphic" onclick="window.loginWithGoogle()">👤</div>
            </div>
        </div>

        <div class="sub-row">
            <div class="sub-title">GLOBAL HARMONY × PROGRESSION WAVE</div>
            <div class="sub-actions">
                <div class="sub-btn neumorphic" onclick="autoTroubleshootBugs()"><span>🛠️</span> Fix Bugs</div>
                <div class="sub-btn neumorphic" onclick="openModal('rateUsModal')"><span>⭐</span> Rate App</div>
                <div class="sub-btn neumorphic" onclick="alert('Share Link: https://ks1007293-cpu.github.io/GLOBAL-HARMON-PLAYER/')"><span>🔗</span> Share App</div>
            </div>
        </div>
    </header>

    <input type="file" id="multiFileInput" accept="audio/*" multiple style="display: none;">

    <!-- MAIN TWO-PANEL LAYOUT -->
    <div class="main-content">
        <div class="panel neumorphic" id="libraryPanel">
            <div class="panel-header">
                <span>Library Vault <span id="trackCount" style="font-size: 12px; color: var(--text-muted);">0</span></span>
            </div>
            <div class="song-grid" id="songGrid"></div>
        </div>

        <div class="panel neumorphic" id="syncPanel">
            <div class="panel-header"><span>Sync Console</span></div>
            <div class="btn neumorphic" style="width: max-content; padding: 15px 30px;" onclick="openModal('createPlaylistModal')">➕ New Playlist</div>
            <div class="song-grid" id="playlistGrid" style="margin-top: 20px;"></div>
        </div>
    </div>

    <!-- BOTTOM PLAYER & NAV BAR -->
    <footer class="bottom-bar neumorphic">
        <div class="nav-items">
            <div class="nav-icon neumorphic" title="Home" onclick="showSection('all')">🏠</div>
            <div class="nav-icon neumorphic" title="Equalizer" onclick="openModal('settingsModal')">🎛️</div>
            <div class="nav-icon neumorphic" title="Party Sync" onclick="openModal('roomModal')">👥</div>
        </div>

        <div class="player-controls">
            <span class="control-icon" onclick="playPreviousTrack()" style="font-size: 24px; cursor:pointer;">⏮</span>
            <audio id="audioElement" class="audio-element neumorphic-inset" controls crossorigin="anonymous"></audio>
            <span class="control-icon" onclick="playNextTrack()" style="font-size: 24px; cursor:pointer;">⏭</span>
        </div>

        <div class="now-playing">
            <div class="song-icon-box neumorphic-inset" style="width: 45px; height: 45px; font-size: 16px;">🎵</div>
            <div class="now-playing-info">
                <h4 id="p-title">Ready System</h4>
                <p id="p-artist">Global Harmony Pro</p>
            </div>
        </div>
    </footer>

    <!-- ADMIN DASHBOARD MODAL (Shows Active Users) -->
    <div class="modal-overlay" id="adminDashboardModal">
        <div class="modal-card neumorphic" style="max-width: 500px;">
            <div class="modal-header">
                <h3>👑 Active Users (Admin)</h3>
                <span style="cursor:pointer;" onclick="closeModal('adminDashboardModal')">✕</span>
            </div>
            <div class="btn neumorphic" style="margin-bottom: 10px;" onclick="fetchActiveUsers()">🔄 Refresh List</div>
            <div id="adminUsersList" style="max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
                <p style="color: var(--text-muted); font-size: 12px;">Loading users...</p>
            </div>
        </div>
    </div>

    <!-- CREATE PLAYLIST MODAL -->
    <div class="modal-overlay" id="createPlaylistModal">
        <div class="modal-card neumorphic">
            <div class="modal-header"><h3>New Playlist</h3><span style="cursor:pointer;" onclick="closeModal('createPlaylistModal')">✕</span></div>
            <input type="text" id="playlistNameInput" class="search-bar neumorphic-inset" placeholder="Playlist Name...">
            <div class="btn neumorphic" style="margin-top: 10px;" onclick="createPlaylist()">Create Playlist</div>
        </div>
    </div>

    <!-- MAIN ENGINE SCRIPT (IndexedDB + Offline Support) -->
    <script>
        const audio = document.getElementById('audioElement');
        const songGrid = document.getElementById('songGrid');
        const playlistGrid = document.getElementById('playlistGrid');
        const multiFileInput = document.getElementById('multiFileInput');
        
        let trackList = [], playlists = [], db, currentPlayingIndex = -1;

        function autoTroubleshootBugs() {
            try {
                alert("🛠️ Optimization Engine Started: Fixing Lag & Rebuilding Cache...");
                if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
                window.location.reload(true);
            } catch(e) { window.location.reload(); }
        }

        const dbRequest = indexedDB.open("HarmonyAudioVaultDB_Neumorphic", 1);
        dbRequest.onupgradeneeded = (e) => {
            const dbRef = e.target.result;
            if (!dbRef.objectStoreNames.contains("saved_songs")) dbRef.createObjectStore("saved_songs", { keyPath: "id", autoIncrement: true });
            if (!dbRef.objectStoreNames.contains("saved_playlists")) dbRef.createObjectStore("saved_playlists", { keyPath: "id", autoIncrement: true });
        };
        dbRequest.onsuccess = (e) => { db = e.target.result; loadAllAppStates(); };

        async function loadAllAppStates() {
            if (!db) return;
            db.transaction(["saved_songs"], "readonly").objectStore("saved_songs").getAll().onsuccess = (e) => { 
                trackList = e.target.result || []; renderSongGridLazy(trackList); 
            };
            db.transaction(["saved_playlists"], "readonly").objectStore("saved_playlists").getAll().onsuccess = (e) => { 
                playlists = e.target.result || []; renderPlaylistGrid(playlists); 
            };
        }

        function renderSongGridLazy(list) {
            songGrid.innerHTML = '';
            document.getElementById('trackCount').innerText = list.length;
            if (list.length === 0) { songGrid.innerHTML = `<p style="font-size:12px; color:var(--text-muted); grid-column: 1/-1;">Vault empty. Import local MP3 files...</p>`; return; }
            list.forEach((track, i) => {
                const card = document.createElement('div');
                card.className = 'song-card neumorphic';
                card.innerHTML = `<div class="song-icon-box neumorphic-inset" onclick="playTrack(${i})">▶</div><h3 class="song-title">${track.title}</h3>`;
                songGrid.appendChild(card);
            });
        }

        function renderPlaylistGrid(list) {
            playlistGrid.innerHTML = '';
            list.forEach((pl) => {
                const card = document.createElement('div');
                card.className = 'song-card neumorphic';
                card.innerHTML = `<div class="song-icon-box neumorphic-inset">📂</div><h3 class="song-title">${pl.name}</h3>`;
                playlistGrid.appendChild(card);
            });
        }

        multiFileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files || files.length === 0) return;
            for (let file of files) {
                await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        if (db) {
                            const tx = db.transaction(["saved_songs"], "readwrite");
                            tx.oncomplete = () => resolve();
                            tx.objectStore("saved_songs").add({ title: file.name.replace(/\.[^/.]+$/, ""), audioData: event.target.result });
                        } else resolve();
                    };
                    reader.readAsArrayBuffer(file);
                });
            }
            loadAllAppStates();
        });

        function playTrack(index) {
            if (index < 0 || index >= trackList.length) return;
            currentPlayingIndex = index;
            const track = trackList[index];
            if (track.audioData) {
                const blob = new Blob([track.audioData], { type: 'audio/mp3' });
                audio.src = URL.createObjectURL(blob);
            }
            document.getElementById('p-title').innerText = track.title;
            audio.play().catch(() => {});
        }

        function playNextTrack() { if (trackList.length > 0) playTrack((currentPlayingIndex + 1) % trackList.length); }
        function playPreviousTrack() { if (trackList.length > 0) playTrack((currentPlayingIndex - 1 + trackList.length) % trackList.length); }
        
        function createPlaylist() {
            const name = document.getElementById('playlistNameInput').value;
            if(!name || !db) return;
            const tx = db.transaction(["saved_playlists"], "readwrite");
            tx.oncomplete = () => { closeModal('createPlaylistModal'); loadAllAppStates(); };
            tx.objectStore("saved_playlists").add({ name: name, songs: [] });
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>

    <!-- FIREBASE AUTH & FIRESTORE (For User Tracking & Admin Panel) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3e0JDyDUQSMzHrHq_RKJKvPfCHWkItCo",
            authDomain: "global-harmony-pro.firebaseapp.com",
            projectId: "global-harmony-pro",
            storageBucket: "global-harmony-pro.firebasestorage.app",
            messagingSenderId: "709699775213",
            appId: "1:709699775213:web:fc7b76bb24b7a699b17ae4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const dbFirestore = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.loginWithGoogle = async function() {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) { alert("Login Error: " + error.message); }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Update Profile Name on UI
                document.getElementById('profileNameDisplay').innerText = user.displayName.split(" ")[0];
                
                // VIP / Founder Access Check
                const email = user.email.toLowerCase();
                if (email.includes("globalharmonypro9052") || email.includes("ks1007293") || email.includes("kn863422")) {
                    document.body.classList.add('founder-active');
                    document.body.classList.add('vip-active');
                }

                // 💾 Save Logged-In User Details to Firestore (For Admin Panel)
                try {
                    await setDoc(doc(dbFirestore, "active_users", user.uid), {
                        name: user.displayName,
                        email: user.email,
                        photoURL: user.photoURL,
                        lastLogin: new Date().toLocaleString()
                    }, { merge: true });
                } catch (e) { console.error("Firestore Error: Enable Firestore Database in Firebase Console."); }
            }
        });

        // 👑 ADMIN PANEL: Fetch Users Function
        window.fetchActiveUsers = async function() {
            const listDiv = document.getElementById('adminUsersList');
            listDiv.innerHTML = '<p style="text-align:center; font-size: 13px;">Fetching active users...</p>';
            
            try {
                const querySnapshot = await getDocs(collection(dbFirestore, "active_users"));
                listDiv.innerHTML = '';
                let count = 0;
                
                querySnapshot.forEach((doc) => {
                    count++;
                    const data = doc.data();
                    listDiv.innerHTML += `
                        <div class="admin-user-row neumorphic-inset">
                            <img src="${data.photoURL || 'https://via.placeholder.com/40'}" class="admin-user-img">
                            <div class="admin-user-info">
                                <h4>${data.name}</h4>
                                <p>${data.email}</p>
                            </div>
                            <div style="margin-left: auto; font-size:11px; color: #10b981; font-weight: bold;">🟢 Active</div>
                        </div>
                    `;
                });

                if(count === 0) {
                    listDiv.innerHTML = '<p style="text-align:center; font-size: 13px;">No active users found.</p>';
                }
            } catch (error) {
                listDiv.innerHTML = `
                    <div style="color: red; font-size: 12px; padding: 10px; text-align: left;">
                        <strong>Database Error!</strong><br><br>
                        1. Go to Firebase Console.<br>
                        2. Click on "Firestore Database" in the left menu.<br>
                        3. Click "Create Database".<br>
                        4. Start in "Test Mode" so the app can read/write users.
                    </div>`;
            }
        }
    </script>
</body>
</html>
