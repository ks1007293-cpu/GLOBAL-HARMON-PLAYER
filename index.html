        .btn-cyber:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #080810, 0 0 16px rgba(0, 240, 255, 0.4); }

        .sidebar { width: 230px; background: #0a0a0f; padding: 20px 10px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid rgba(255,255,255,0.08); }

        /* MAIN DASHBOARD */
        .main { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 18px; padding-bottom: 220px; overflow-x: hidden; width: 100%; }

        .song-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; width: 100%; }
        .song-card { background: #141420; padding: 12px; border-radius: 16px; cursor: pointer; text-align: center; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; align-items: center; gap: 10px; position: relative; width: 100%; }
        .media-player-box { width: 100%; aspect-ratio: 1/1; background: #0c0c14; border-radius: 12px; border: 1px solid rgba(0,240,255,0.3); display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }

        .song-card h3 { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #eee; width: 100%; }

        .lyrics-box-container { background: #0e0e16; border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 16px; padding: 12px; height: 110px; overflow-y: auto; text-align: center; width: 100%; }
        .lyric-line { font-size: 12px; color: #777; margin: 4px 0; }
        .lyric-line.active { font-size: 14px; font-weight: 900; color: var(--primary-glow); }

        /* PLAYER BAR */
        .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 95px; background: #0a0a12; display: flex; justify-content: space-between; align-items: center; padding: 12px 25px; border-top: 2px solid var(--primary-glow); z-index: 1000; transform: translateY(100%); transition: transform 0.2s ease; }
        .player-bar.active { transform: translateY(0); }
        .now-playing { display: flex; align-items: center; gap: 10px; width: 35%; }
        
        .controls { width: 45%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .btn-row { display: flex; gap: 16px; align-items: center; }
        .control-icon { color: var(--text-grey); font-size: 18px; cursor: pointer; }
        .control-icon:hover { color: var(--primary-glow); }
        .audio-element-custom { width: 100%; height: 28px; filter: invert(1); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; justify-content: center; align-items: center; padding: 20px; }
        .modal-card { background: #12121a; border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 20px; width: 100%; max-width: 580px; padding: 22px; display: flex; flex-direction: column; gap: 14px; max-height: 85vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; width: 100%; }

            .main { padding: 10px; padding-bottom: 180px; }
            .player-bar { bottom: 45px; height: 85px; padding: 8px 12px; }

    <!-- MAIN ENGINE SCRIPT -->
    <script>
        const audio = document.getElementById('audioElement');
        const songGrid = document.getElementById('songGrid');
        const playerBar = document.getElementById('playerBar');
        const multiFileInput = document.getElementById('multiFileInput');
        
        let trackList = [], db, currentPlayingIndex = -1;

        /* AUTOMATIC TROUBLESHOOTING ENGINE */
        function autoTroubleshootBugs() {
            try {
                if (navigator.serviceWorker) {
                    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
                }
                localStorage.setItem('harmony_troubleshoot_time', Date.now());
                alert("🛠️ Auto-Fixing Audio Cache & Vault Connections...");
                window.location.reload(true);
            } catch(e) {
                alert("Refresh needed!");
            }
        }

        /* INDEXEDDB VAULT ENGINE */
        const dbRequest = indexedDB.open("HarmonyAudioVaultDB", 14);
        dbRequest.onupgradeneeded = (e) => {
            const dbRef = e.target.result;
            if (!dbRef.objectStoreNames.contains("saved_songs")) {
                dbRef.createObjectStore("saved_songs", { keyPath: "id", autoIncrement: true });
            }
        };

        dbRequest.onsuccess = (e) => {
            db = e.target.result;
            loadTracksFromDB();
            checkAppPersistentStates();
        };

        function checkAppPersistentStates() {
            if (localStorage.getItem('harmony_is_vip') === 'true') document.body.classList.add('vip-active');
            if (localStorage.getItem('harmony_is_founder') === 'true') document.body.classList.add('founder-active');
        }

        function loadTracksFromDB() {
            if (!db) return;
            const tx = db.transaction(["saved_songs"], "readonly");
            const store = tx.objectStore("saved_songs");
            store.getAll().onsuccess = (event) => {
                trackList = event.target.result || [];
                renderSongGridLazy(trackList);
            };
        }

        function renderSongGridLazy(list) {
            songGrid.innerHTML = '';
            document.getElementById('trackCount').innerText = `${list.length} Songs`;
            list.forEach((track, i) => {
                const card = document.createElement('div');
                card.className = 'song-card';
                card.innerHTML = `<div class="media-player-box" onclick="playTrack(${i})"><span class="play-overlay-icon">▶</span></div><h3>${track.title}</h3>`;
                songGrid.appendChild(card);
            });
        }

        multiFileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files || files.length === 0) return;

            for (let file of files) {
                await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        if (db) {
                            const tx = db.transaction(["saved_songs"], "readwrite");
                            const store = tx.objectStore("saved_songs");
                            store.add({ title: file.name.replace(/\.[^/.]+$/, ""), audioData: event.target.result });
                            tx.oncomplete = () => resolve();
                        } else resolve();
                    };
                    reader.readAsArrayBuffer(file);
                });
            }
            loadTracksFromDB();
        });

        function playTrack(index) {
            if (index < 0 || index >= trackList.length) return;
            currentPlayingIndex = index;
            const track = trackList[index];
            if (track.audioData) {
                const blob = new Blob([track.audioData], { type: 'audio/mp3' });
                audio.src = URL.createObjectURL(blob);
            }
            document.getElementById('p-title').innerText = track.title;
            audio.play().catch(() => {});
            playerBar.classList.add('active');
        }

        function playNextTrack() { if (trackList.length > 0) playTrack((currentPlayingIndex + 1) % trackList.length); }
        function playPreviousTrack() { if (trackList.length > 0) playTrack((currentPlayingIndex - 1 + trackList.length) % trackList.length); }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>

        });
    </script>
