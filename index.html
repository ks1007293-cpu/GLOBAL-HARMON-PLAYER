<head>

    <style>
        :root {
            --bg-color: #050508;
            --panel-bg: #111115;
            --text-main: #ffffff;
            --text-muted: #888888;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --btn-white: #ffffff;
            --btn-text: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* NEON PANELS */
        .neon-panel {
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.05);
            transition: all 0.2s ease;
        }

        /* WHITE BUTTONS */
        .btn-white {
            background: var(--btn-white);
            color: var(--btn-text);
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 800;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.2);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-white:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(255, 255, 255, 0.5); }
        .btn-white:active { transform: scale(0.95); }

        /* GOLDEN TICKET PREMIUM BADGE */
        .golden-ticket {
            background: linear-gradient(135deg, #fde047 0%, #eab308 50%, #ca8a04 100%);
            color: #422006;
            font-weight: 900;
            border: 2px dashed #000;
            padding: 8px 16px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(202, 138, 4, 0.6);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            transition: transform 0.15s ease;
            text-transform: uppercase;
        }
        .golden-ticket:hover { transform: scale(1.05) rotate(-1deg); }

        /* HEADER LAYOUT */
        .header { padding: 15px 30px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 0; z-index: 100; background: rgba(5, 5, 8, 0.85); backdrop-filter: blur(10px); border-bottom: 2px solid var(--neon-pink); }
        .top-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 15px; }
        
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 18px; color: var(--neon-cyan); letter-spacing: 1px; }
        .brand svg { width: 32px; height: 32px; filter: drop-shadow(0 0 5px var(--neon-cyan)); }

        .search-container { flex: 1; max-width: 400px; display: flex; align-items: center; gap: 10px; }
        .search-bar { width: 100%; padding: 12px 20px; font-size: 14px; color: #fff; background: #1a1a24; border: 1px solid var(--neon-cyan); border-radius: 8px; outline: none; }
        .search-bar:focus { box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }

        .right-actions { display: flex; align-items: center; gap: 15px; }
        
        /* UPDATED PROFILE PILL */
        .profile-icon { height: 36px; padding: 0 16px; border-radius: 18px; display: flex; justify-content: center; align-items: center; font-size: 13px; cursor: pointer; background: var(--btn-white); color: #000; font-weight: 800; gap: 6px; box-shadow: 0 4px 10px rgba(255, 255, 255, 0.2); }
        .profile-icon:hover { transform: scale(1.05); }

        .founder-badge { display: none; }
        body.founder-active .founder-badge { display: inline-flex !important; }

        .sub-row { display: flex; justify-content: space-between; align-items: center; width: 100%; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); }
        .sub-title { font-weight: 800; font-size: 16px; letter-spacing: 0.5px; color: var(--neon-pink); }
        .sub-actions { display: flex; gap: 15px; }
        
        /* MAIN TWO-PANEL LAYOUT */
        .main-content { display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; padding: 20px 30px 120px 30px; flex: 1; }
        .panel { padding: 25px; display: flex; flex-direction: column; gap: 20px; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 700; color: var(--neon-cyan); border-bottom: 1px solid rgba(0,240,255,0.2); padding-bottom: 10px; }
        
        .song-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 20px; }
        .song-card { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 15px; cursor: pointer; background: #151520; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
        .song-card:hover { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); transform: translateY(-3px); }
        .song-icon-box { width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; font-size: 24px; background: #222; color: var(--neon-cyan); border-radius: 12px; }
        .song-title { font-size: 12px; font-weight: 600; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }

        /* UNIFIED BOTTOM PLAYER BAR */
        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; background: rgba(5, 5, 8, 0.9); backdrop-filter: blur(10px); border-top: 2px solid var(--neon-cyan); border-radius: 24px 24px 0 0; }
        .nav-items { display: flex; gap: 15px; align-items: center; }
        .nav-icon { width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; border-radius: 12px; background: var(--btn-white); color: #000; transition: 0.2s; }
        .nav-icon:hover { box-shadow: 0 0 15px rgba(255,255,255,0.5); }
        
        .player-controls { flex: 1; display: flex; justify-content: center; align-items: center; gap: 20px; padding: 0 40px; }
        .audio-element { width: 100%; max-width: 500px; height: 35px; border-radius: 20px; filter: invert(1); }

        .now-playing { display: flex; align-items: center; gap: 12px; width: 250px; }
        .now-playing-info h4 { font-size: 13px; font-weight: 700; color: var(--neon-cyan); }
        .now-playing-info p { font-size: 11px; color: var(--text-muted); }

        .control-icon { transition: all 0.2s; }
        .control-icon:hover { transform: scale(1.1); text-shadow: 0 0 10px rgba(255,255,255,0.5); }

        /* MODALS */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 3000; justify-content: center; align-items: center; }
        .modal-card { width: 90%; max-width: 450px; padding: 25px; display: flex; flex-direction: column; gap: 15px; text-align: center; background: #111; border: 1px solid var(--neon-cyan); border-radius: 16px; box-shadow: 0 0 20px rgba(0,240,255,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 18px; color: var(--neon-pink); }

        /* ADMIN PANEL USER LIST */
        .admin-user-row { display: flex; align-items: center; gap: 15px; padding: 12px; text-align: left; background: #1a1a24; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .admin-user-img { width: 40px; height: 40px; border-radius: 50%; }
        .admin-user-info h4 { font-size: 14px; margin-bottom: 2px; color: #fff;}
        .admin-user-info p { font-size: 11px; color: var(--text-muted); }

        @media (max-width: 900px) {
            .main-content { grid-template-columns: 1fr; }
            .top-row { flex-wrap: wrap; }
            .search-container { order: 3; max-width: 100%; }
            .bottom-bar { flex-direction: column; gap: 15px; padding: 15px; border-radius: 16px 16px 0 0; }
            .player-controls { width: 100%; padding: 0; }
        }
    </style>
</head>
<body>

    <!-- HEADER SECTION -->
    <header class="header">
        <div class="top-row">
            <div class="brand">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="45" stroke="#00f0ff" stroke-width="8"/>
                    <path d="M50 25 C30 25 25 40 25 50 C25 60 30 75 50 75 C70 75 75 60 75 50 H50" stroke="#ff007f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Global Harmony
            </div>
            
            <div class="search-container">
                <input type="text" class="search-bar" id="searchInput" placeholder="Search Songs..." onkeyup="searchSongs()">
            </div>

            <div class="right-actions">
                <label for="multiFileInput" class="btn-white" id="importBtnLabel">➕ Import Songs</label>
                <!-- ADMIN PANEL BUTTON -->
                <button class="btn-white founder-badge" onclick="openModal('adminDashboardModal'); fetchActiveUsers();">👑 ADMIN</button>
                <div class="golden-ticket" onclick="openModal('vipGateModal')">🎟️ +GET PREMIUM</div>
                <!-- PROFILE BUTTON -->
                <div class="profile-icon" onclick="window.loginWithGoogle()">
                    👤 <span id="profileNameDisplay">Login</span>
                </div>
            </div>
        </div>

        <div class="sub-row">
            <div class="sub-title">PROGRESSION WAVE × CYBER STUDIO</div>
            <div class="sub-actions">
                <div class="btn-white" style="padding: 6px 12px; font-size: 11px;" onclick="autoTroubleshootBugs()">🛠️ Fix Bugs</div>
                <div class="btn-white" style="padding: 6px 12px; font-size: 11px;" onclick="openModal('rateUsModal')">⭐ Rate</div>
            </div>
        </div>
    </header>

    <input type="file" id="multiFileInput" accept="audio/*" multiple style="display: none;">

    <!-- MAIN TWO-PANEL LAYOUT -->
    <div class="main-content">
        <div class="panel neon-panel" id="libraryPanel">
            <div class="panel-header">
                <span>Library Vault <span id="trackCount" style="font-size: 12px; color: var(--text-muted);">0</span></span>
            </div>
            <div class="song-grid" id="songGrid"></div>
        </div>

        <div class="panel neon-panel" id="syncPanel">
            <div class="panel-header"><span>Sync Console</span></div>
            <div class="btn-white" style="width: max-content;" onclick="openModal('createPlaylistModal')">➕ New Playlist</div>
            <div class="song-grid" id="playlistGrid" style="margin-top: 20px;"></div>
        </div>
    </div>

    <!-- BOTTOM PLAYER & NAV BAR -->
    <footer class="bottom-bar">
        <div class="nav-items">
            <div class="nav-icon" title="Home" onclick="showSection('all')">🏠</div>
            <div class="nav-icon" title="Equalizer" onclick="openModal('settingsModal')">🎛️</div>
            <div class="nav-icon" title="Party Sync" onclick="openModal('roomModal')">👥</div>
        </div>

        <div class="player-controls">
            <span class="control-icon" onclick="playPreviousTrack()" style="font-size: 24px; cursor:pointer; color:#fff;">⏮</span>
            <!-- 8D SPATIAL AUDIO BUTTON -->
            <span class="control-icon" id="spatialBtn" onclick="toggle8DSpatialAudio()" style="font-size: 24px; cursor:pointer; color:#fff; font-weight:bold;" title="Toggle Spatial Audio">🌌</span>
            <audio id="audioElement" class="audio-element" controls crossorigin="anonymous"></audio>
            <span class="control-icon" onclick="playNextTrack()" style="font-size: 24px; cursor:pointer; color:#fff;">⏭</span>
        </div>

        <div class="now-playing">
            <div class="song-icon-box" style="width: 45px; height: 45px; font-size: 16px;">🎵</div>
            <div class="now-playing-info">
                <h4 id="p-title">Ready System</h4>
                <p id="p-artist">Global Harmony Pro</p>
            </div>
        </div>
    </footer>

    <!-- ADMIN DASHBOARD MODAL -->
    <div class="modal-overlay" id="adminDashboardModal">
        <div class="modal-card" style="max-width: 500px;">
            <div class="modal-header">
                <h3>👑 Active Users (Admin)</h3>
                <span style="cursor:pointer;" onclick="closeModal('adminDashboardModal')">✕</span>
            </div>
            <div class="btn-white" style="margin-bottom: 10px;" onclick="fetchActiveUsers()">🔄 Refresh List</div>
            <div id="adminUsersList" style="max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
                <p style="color: var(--text-muted); font-size: 12px;">Loading users...</p>
            </div>
        </div>
    </div>

    <!-- CREATE PLAYLIST MODAL -->
    <div class="modal-overlay" id="createPlaylistModal">
        <div class="modal-card">
            <div class="modal-header"><h3>New Playlist</h3><span style="cursor:pointer;" onclick="closeModal('createPlaylistModal')">✕</span></div>
            <input type="text" id="playlistNameInput" class="search-bar" placeholder="Playlist Name...">
            <div class="btn-white" style="margin-top: 10px;" onclick="createPlaylist()">Create Playlist</div>
        </div>
    </div>

    <!-- MAIN ENGINE SCRIPT -->
    <script>
        const audio = document.getElementById('audioElement');
        const songGrid = document.getElementById('songGrid');
        const playlistGrid = document.getElementById('playlistGrid');
        const multiFileInput = document.getElementById('multiFileInput');
        
        let trackList = [], playlists = [], db, currentPlayingIndex = -1;

        // --- 🚀 AUTO-PLAY NEXT SONG FIX 🚀 ---
        // Jaise hi ek gaana khatam hoga, agla gaana automatic chal padega
        audio.addEventListener('ended', playNextTrack);
        // -------------------------------------

        // --- SPATIAL AUDIO (WEB AUDIO API) ---
        let audioCtx, trackNode, pannerNode, isSpatialActive = false, spatialInterval;
        
        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                trackNode = audioCtx.createMediaElementSource(audio);
                pannerNode = audioCtx.createStereoPanner();
                trackNode.connect(pannerNode);
                pannerNode.connect(audioCtx.destination);
            }
        }
        
        window.toggle8DSpatialAudio = function() {
            initAudioContext();
            if (audioCtx.state === 'suspended') { audioCtx.resume(); } 
            
            isSpatialActive = !isSpatialActive;
            const btn = document.getElementById('spatialBtn');
            
            if(isSpatialActive) {
                btn.style.color = 'var(--neon-pink)';
                btn.style.textShadow = '0 0 15px var(--neon-pink)';
                alert("🌌 360° Quantum Spatial Audio Activated!");
                
                let pan = -1;
                let direction = 0.04;
                spatialInterval = setInterval(() => {
                    pan += direction;
                    if(pan >= 1 || pan <= -1) direction = -direction;
                    pannerNode.pan.value = pan;
                }, 100);
            } else {
                btn.style.color = '#fff';
                btn.style.textShadow = 'none';
                alert("Spatial Audio Deactivated.");
                clearInterval(spatialInterval);
                pannerNode.pan.value = 0;
            }
        }
        // -------------------------------------

        function autoTroubleshootBugs() {
            try {
                if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
                window.location.reload(true);
            } catch(e) { window.location.reload(); }
        }

        // IndexedDB Initialization
        const dbRequest = indexedDB.open("HarmonyAudioVaultDB_Neon", 2);
        dbRequest.onupgradeneeded = (e) => {
            const dbRef = e.target.result;
            if (!dbRef.objectStoreNames.contains("saved_songs")) dbRef.createObjectStore("saved_songs", { keyPath: "id", autoIncrement: true });
            if (!dbRef.objectStoreNames.contains("saved_playlists")) dbRef.createObjectStore("saved_playlists", { keyPath: "id", autoIncrement: true });
        };
        dbRequest.onsuccess = (e) => { db = e.target.result; loadAllAppStates(); };

        async function loadAllAppStates() {
            if (!db) return;
            db.transaction(["saved_songs"], "readonly").objectStore("saved_songs").getAll().onsuccess = (e) => { 
                trackList = e.target.result || []; renderSongGridLazy(trackList); 
            };
            db.transaction(["saved_playlists"], "readonly").objectStore("saved_playlists").getAll().onsuccess = (e) => { 
                playlists = e.target.result || []; renderPlaylistGrid(playlists); 
            };
        }

        function renderSongGridLazy(list) {
            songGrid.innerHTML = '';
            document.getElementById('trackCount').innerText = list.length;
            if (list.length === 0) { songGrid.innerHTML = `<p style="font-size:12px; color:var(--text-muted); grid-column: 1/-1;">Vault empty. Import local MP3 files...</p>`; return; }
            list.forEach((track, i) => {
                const card = document.createElement('div');
                card.className = 'song-card';
                card.innerHTML = `<div class="song-icon-box" onclick="playTrack(${i})">▶</div><h3 class="song-title">${track.title}</h3>`;
                songGrid.appendChild(card);
            });
        }

        function renderPlaylistGrid(list) {
            playlistGrid.innerHTML = '';
            list.forEach((pl) => {
                const card = document.createElement('div');
                card.className = 'song-card';
                card.innerHTML = `<div class="song-icon-box">📂</div><h3 class="song-title">${pl.name}</h3>`;
                playlistGrid.appendChild(card);
            });
        }

        /* SUPER FAST INSTANT IMPORT */
        multiFileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files || files.length === 0) return;
            
            const importLabel = document.getElementById('importBtnLabel');
            importLabel.innerText = "⏳ Saving...";

            const tx = db.transaction(["saved_songs"], "readwrite");
            const store = tx.objectStore("saved_songs");
            
            files.forEach(file => {
                store.add({ title: file.name.replace(/\.[^/.]+$/, ""), fileObj: file });
            });

            tx.oncomplete = () => {
                importLabel.innerText = "➕ Import Songs";
                loadAllAppStates(); 
            };
        });

        function playTrack(index) {
            if (index < 0 || index >= trackList.length) return;
            currentPlayingIndex = index;
            const track = trackList[index];
            
            if (track.fileObj) {
                audio.src = URL.createObjectURL(track.fileObj);
            } else if (track.audioData) {
                const blob = new Blob([track.audioData], { type: 'audio/mp3' });
                audio.src = URL.createObjectURL(blob);
            }
            
            document.getElementById('p-title').innerText = track.title;
            
            if(audioCtx && audioCtx.state === 'suspended') { audioCtx.resume(); }
            audio.play().catch(() => {});
        }

        function playNextTrack() { if (trackList.length > 0) playTrack((currentPlayingIndex + 1) % trackList.length); }
        function playPreviousTrack() { if (trackList.length > 0) playTrack((currentPlayingIndex - 1 + trackList.length) % trackList.length); }
        
        function createPlaylist() {
            const name = document.getElementById('playlistNameInput').value;
            if(!name || !db) return;
            const tx = db.transaction(["saved_playlists"], "readwrite");
            tx.oncomplete = () => { closeModal('createPlaylistModal'); loadAllAppStates(); };
            tx.objectStore("saved_playlists").add({ name: name, songs: [] });
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>

    <!-- FIREBASE AUTH & FIRESTORE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3e0JDyDUQSMzHrHq_RKJKvPfCHWkItCo",
            authDomain: "global-harmony-pro.firebaseapp.com",
            projectId: "global-harmony-pro",
            storageBucket: "global-harmony-pro.firebasestorage.app",
            messagingSenderId: "709699775213",
            appId: "1:709699775213:web:fc7b76bb24b7a699b17ae4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const dbFirestore = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.loginWithGoogle = async function() {
            try {
                const res = await signInWithPopup(auth, provider);
                alert("Successfully Logged In! Welcome, " + res.user.displayName.split(" ")[0]);
            } catch (error) { 
                console.error(error);
                alert("Login Error: " + error.message + "\n\nTip: Allow popups for this site!"); 
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const firstName = user.displayName ? user.displayName.split(" ")[0] : "User";
                
                const nameDisplayElement = document.getElementById('profileNameDisplay');
                if(nameDisplayElement) {
                    nameDisplayElement.innerText = firstName;
                }
                
                const email = user.email.toLowerCase();
                if (email.includes("globalharmonypro9052") || email.includes("ks1007293") || email.includes("kn863422")) {
                    document.body.classList.add('founder-active');
                    document.body.classList.add('vip-active');
                }

                try {
                    await setDoc(doc(dbFirestore, "active_users", user.uid), {
                        name: user.displayName || "Unknown User",
                        email: user.email,
                        photoURL: user.photoURL,
                        lastLogin: new Date().toLocaleString()
                    }, { merge: true });
                } catch (e) { console.error("Firestore Save Error:", e); }
            }
        });

        window.fetchActiveUsers = async function() {
            const listDiv = document.getElementById('adminUsersList');
            listDiv.innerHTML = '<p style="text-align:center; font-size: 13px;">Fetching active users...</p>';
            
            try {
                const querySnapshot = await getDocs(collection(dbFirestore, "active_users"));
                listDiv.innerHTML = '';
                let count = 0;
                
                querySnapshot.forEach((doc) => {
                    count++;
                    const data = doc.data();
                    listDiv.innerHTML += `
                        <div class="admin-user-row">
                            <img src="${data.photoURL || 'https://via.placeholder.com/40'}" class="admin-user-img">
                            <div class="admin-user-info">
                                <h4>${data.name}</h4>
                                <p>${data.email}</p>
                            </div>
                            <div style="margin-left: auto; font-size:11px; color: var(--neon-cyan); font-weight: bold;">🟢 Active</div>
                        </div>
                    `;
                });

                if(count === 0) listDiv.innerHTML = '<p style="text-align:center; font-size: 13px;">No active users found.</p>';
            } catch (error) {
                listDiv.innerHTML = '<p style="color:red; font-size:12px;">Database Error! Check Firebase Firestore rules.</p>';
            }
        }
    </script>
</body>
